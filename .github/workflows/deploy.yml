name: Deploy
# Production release: runs only after a human merges a reviewed PR into main.
# Fast rollback: run the Rollback workflow with a previous Deploy run ID (redeploys its exact build).
# Fix forward: revert the PR; merging the revert deploys again.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - name: Build for Pages
        run: npx vite build --base=./
        env:
          VITE_DEMO_TODAY: '2026-11-11'
          VITE_BUILD_SHA: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Keep each release's exact build for 90 days so Rollback can redeploy it without rebuilding.
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: dist
          retention-days: 90
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
